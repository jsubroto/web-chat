<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Web Chat</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.3.6/css/bootstrap.min.css">
    <style>
        body {
            margin-top: 30px;
        }

        [hidden] {
            display: none !important;
        }
    </style>
</head>

<body>
    <div class="container">
        <div id="userFormArea" class="row">
            <div class="col-md-12">
                <form id="userForm">
                    <label>Please enter a username</label>
                    <input class="form-control" id="username" maxlength="32" />
                    <br/>
                    <input type="submit" class="btn btn-primary" value="Login" />
                </form>
            </div>

        </div>



        <div id="messageArea" class="row" hidden>
            <div class="col-md-4">
                <div class="well">
                    <h3>Online Users</h3>
                    <ul class="list-group" id="users"></ul>
                </div>
            </div>
            <div class="col-md-8">
                <div class="chat" id="chat"></div>
                <form id="messageForm">
                    <label>Enter Message</label>
                    <textarea class="form-control" id="message" maxlength="2000"></textarea>
                    <br/>
                    <input type="submit" class="btn btn-primary" value="Send Message" />
                </form>
            </div>
        </div>
    </div>
    <script>
        const $ = (id) => document.getElementById(id);
        const socket = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}`);
        const send = (event) => socket.send(JSON.stringify(event));

        $('userForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const username = $('username').value.trim();
            if (!username) return;
            send({ type: 'join', username });
            $('userFormArea').hidden = true;
            $('messageArea').hidden = false;
        });

        $('messageForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const text = $('message').value.trim();
            if (!text) return;
            send({ type: 'message', text });
            $('message').value = '';
        });

        socket.addEventListener('message', ({ data }) => {
            const event = JSON.parse(data);

            if (event.type === 'message') {
                const message = document.createElement('div');
                const user = document.createElement('strong');
                message.className = 'well';
                user.textContent = event.user;
                message.append(user, `: ${event.text}`);
                $('chat').append(message);
            } else if (event.type === 'users') {
                $('users').replaceChildren(...event.users.map((username) => {
                    const item = document.createElement('li');
                    item.className = 'list-group-item';
                    item.textContent = username;
                    return item;
                }));
            }
        });
    </script>
</body>

</html>
